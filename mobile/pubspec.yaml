name: mobile
description: "Medi-Bela - offline-first healthcare reminder app"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^18.0.0

  # Networking
  dio: ^5.11.0
  connectivity_plus: ^7.3.1

  # Local database (offline-first primary read source)
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.0

  # Secure token storage (never SQLite)
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.5

  # Local reminders (medicine/health reminders scheduled on-device)
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0

  # IDs for locally-created (offline) records
  uuid: ^4.5.1

  # JSON model helpers
  json_annotation: ^4.12.0

  # Prescription image capture (local-first draft, upload endpoint pending)
  image_picker: ^1.1.2

  flutter_localizations:
    sdk: flutter
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  url_launcher: ^6.3.3
  # Round 16: the doctor's PDF report, built on the phone and shared or
  # printed (owner approved 2026-11-10 / 2026-11-11).
  pdf: ^3.12.0
  printing: ^5.14.3
  # Round 17: ask the assistant by voice (the phone's speech recognizer,
  # bn-BD / en; owner approved 2026-11-10 / 2026-11-12).
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Drift code generation - run `dart run build_runner build` after `flutter pub get`
  build_runner: ^2.4.13
  drift_dev: ^2.34.3
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  assets:
    # Logos and (Round 13) the full-screen pictures: medicine_image.png
    # (medicine reminder), medical_test.png (test reminder), buying_medicine.png
    # (medicine box ran out).
    # A folder entry, so the build works before the picture is added.
    - assets/images/
    # About us team photos, 320x320 (Round 11).
    - assets/images/team/

# Round 16: pdf 3.12 caps archive below 4.1, but image 4.11 needs a newer
# archive (an upstream mismatch); keep image (pulled in by pdf) below 4.11.
dependency_overrides:
  image: ">=4.3.0 <4.11.0"
