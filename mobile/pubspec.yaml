name: mobile
description: "Medi-Bela - offline-first healthcare reminder app"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^18.0.0

  # Networking
  dio: ^5.11.0
  connectivity_plus: ^7.3.1

  # Local database (offline-first primary read source)
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.0

  # Secure token storage (never SQLite)
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.5

  # Local reminders (medicine/health reminders scheduled on-device)
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0

  # IDs for locally-created (offline) records
  uuid: ^4.5.1

  # JSON model helpers
  json_annotation: ^4.12.0

  # Prescription image capture (local-first draft, upload endpoint pending)
  image_picker: ^1.1.2

  flutter_localizations:
    sdk: flutter
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Drift code generation - run `dart run build_runner build` after `flutter pub get`
  build_runner: ^2.4.13
  drift_dev: ^2.34.3
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logoEn.png
    - assets/images/logoBn.png